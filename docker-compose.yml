services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: intenttech
      POSTGRES_PASSWORD: intenttech
      POSTGRES_DB: intenttech
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  api:
    build: ./api
    environment:
      DATABASE_URL: postgres://intenttech:intenttech@postgres:5432/intenttech
      JWT_ACCESS_SECRET: dev-access-secret-change-me
      JWT_REFRESH_SECRET: dev-refresh-secret-change-me
      BOOTSTRAP_ADMIN_EMAIL: admin@example.com
      BOOTSTRAP_ADMIN_PASSWORD: Admin123!
      CORS_ORIGINS: http://localhost:3000
      PORT: "8080"
    ports:
      - "8080:8080"
    depends_on:
      - postgres

  web:
    build: ./web
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8080/api/v1
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  pgdata:
